# Client-certificate outcome for /mcp (ChatGPT mTLS). http-level: log_format
# is not valid inside a server block. Installed by the DupeFont deploy, 2026-10-10.
log_format mcp_mtls '$time_iso8601 $remote_addr verify=$ssl_client_verify dn="$ssl_client_s_dn" issuer="$ssl_client_i_dn" status=$status';
